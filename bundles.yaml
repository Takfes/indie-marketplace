  # ---------------------------------------------------------------------------
  # database — SQL and data engineering skills: query review and
  # optimization (awesome-copilot), Azure Kusto queries (azure-skills),
  # and profiling tables (astronomer).
  # ---------------------------------------------------------------------------
  - name: database
    description: SQL and data engineering skills — query review, optimization, Azure Kusto, and table profiling
    version: "0.1.0"
    catalog: true
    mcp:
      # Postgres-only, query-plan analysis + index tuning. Docker-only —
      # `uvx postgres-mcp` has an upstream bug.
      #
      # --access-mode=restricted is load-bearing: a second SQL validator
      # rejects writes before Postgres sees them, independent of the DB
      # role's own grant.
      #
      # The container's own env var name (DATABASE_URI) is fixed upstream,
      # so the rename happens inline in args instead.
      - name: pgquery
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "DATABASE_URI=${PGQUERY_URI}",
            "crystaldba/postgres-mcp",
            "--access-mode=restricted",
            "--transport=stdio",
          ]
        env:
          PGQUERY_URI:

      # Multi-engine (Postgres/MySQL/MSSQL/BigQuery/...), configured via a
      # tools.yaml mounted into the container — inherently user-specific, so
      # this repo can't ship one. Point DBTOOLS_CONFIG_PATH at your own
      # (absolute path — docker bind mounts reject relative ones).
      # Format: https://googleapis.github.io/genai-toolbox/
      - name: dbtools
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-v",
            "${DBTOOLS_CONFIG_PATH}:/tools.yaml:ro",
            "us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest",
            "--stdio",
            "--config",
            "/tools.yaml",
          ]
        env:
          DBTOOLS_CONFIG_PATH:

      # Dedicated MySQL (benborla/mcp-server-mysql, MIT) — an app-level
      # write gate independent of the DB grant, same pattern as pgquery's
      # --access-mode. No published image; Dockerfile vendored at
      # docker/mysql-mcp/ (pinned commit — see that file). Build once:
      #   docker build -t indie-marketplace-mysql-mcp:local plugins/database/docker/mysql-mcp
      #
      # ALLOW_*_OPERATION flags are hardcoded false here, overriding the
      # image's own true defaults — non-configurable by design.
      - name: mysql-mcp
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "MYSQL_HOST=${MYSQL_MCP_HOST}",
            "-e",
            "MYSQL_USER=${MYSQL_MCP_USER}",
            "-e",
            "MYSQL_PASS=${MYSQL_MCP_PASS}",
            "-e",
            "MYSQL_DB=${MYSQL_MCP_DB}",
            "-e",
            "ALLOW_INSERT_OPERATION=false",
            "-e",
            "ALLOW_UPDATE_OPERATION=false",
            "-e",
            "ALLOW_DELETE_OPERATION=false",
            "indie-marketplace-mysql-mcp:local",
          ]
        env:
          MYSQL_MCP_HOST:
          MYSQL_MCP_USER:
          MYSQL_MCP_PASS:
          MYSQL_MCP_DB:

      # Dedicated MSSQL (JexinSam/mssql_mcp_server, MIT) — query_sql regex-
      # gates to SELECT/WITH/SHOW; execute_sql stays unrestricted upstream,
      # so treat this as read-mostly, not read-only. No published image;
      # Dockerfile vendored at docker/mssql-mcp/ (pinned commit, also fixes
      # an upstream build bug). Build once:
      #   docker build -t indie-marketplace-mssql-mcp:local plugins/database/docker/mssql-mcp
      - name: mssql-mcp
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "MSSQL_HOST=${MSSQL_MCP_HOST}",
            "-e",
            "MSSQL_DATABASE=${MSSQL_MCP_DATABASE}",
            "-e",
            "MSSQL_USER=${MSSQL_MCP_USER}",
            "-e",
            "MSSQL_PASSWORD=${MSSQL_MCP_PASSWORD}",
            "indie-marketplace-mssql-mcp:local",
          ]
        env:
          MSSQL_MCP_HOST:
          MSSQL_MCP_DATABASE:
          MSSQL_MCP_USER:
          MSSQL_MCP_PASSWORD:
    skills:
      - name: sql-code-review
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/sql-code-review"

      - name: sql-optimization
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/sql-optimization"

      - name: azure-kusto
        source: community
        repo: "https://github.com/microsoft/azure-skills"
        path: "skills/azure-kusto"

      - name: profiling-tables
        source: community
        repo: "https://github.com/astronomer/agents"
        path: "skills/profiling-tables"

  # ---------------------------------------------------------------------------
  # azdevops — containers, Kubernetes, CI/CD, and Azure DevOps skills.
  # ---------------------------------------------------------------------------
  - name: azdevops
    description: DevOps and infrastructure skills — containers, Kubernetes, CI/CD, and Azure DevOps
    version: "0.1.0"
    catalog: true
    mcp:
      # Official Azure MCP server (microsoft/mcp), 40+ services. Auth via
      # an existing `az login` session — no env var.
      - name: azcloud
        command: npx
        args: ["-y", "@azure/mcp@latest", "server", "start"]

      # Official Azure DevOps MCP server (microsoft/azure-devops-mcp). Org
      # name is a required positional arg, injected via ${...}.
      # --authentication azcli reuses the same `az login` session as
      # azcloud (upstream default is an interactive browser sign-in).
      - name: azdevops
        command: npx
        args:
          [
            "-y",
            "@azure-devops/mcp",
            "${AZDEVOPS_ORG}",
            "--authentication",
            "azcli",
          ]
        env:
          AZDEVOPS_ORG:

      # Official AKS MCP server (Azure/aks-mcp) — a Go binary with no npm
      # package; download a release from
      # https://github.com/Azure/aks-mcp/releases/latest and point
      # AZAKS_BIN at it. Auth: `az login` + kubeconfig, readonly by default.
      - name: azaks
        command: "${AZAKS_BIN}"
        args: ["--transport", "stdio"]
        env:
          AZAKS_BIN:

      # Azure Data Explorer / Kusto (johnib/kusto-mcp, npm) — picked over
      # pab1it0/adx-mcp-server, which hands raw queries straight to the
      # Kusto SDK with no read-only layer.
      #
      # KUSTO_ALLOW_WRITE_OPERATIONS=false is load-bearing: upstream
      # defaults it true; setting it false enables a real validator
      # rejecting every dot-command except the introspective .show family.
      #
      # Auth: fill in the three service-principal vars for an unattended
      # identity, or leave them blank to fall through to managed identity
      # then the same `az login` session azcloud/azdevops use.
      #
      # Caveat: reports anonymous usage telemetry to the maintainer (tool
      # names, latency, salted tenant/user hashes — never query text or
      # results); redirectable to your own OTLP collector, not disable-able.
      - name: azkusto
        command: env
        args:
          [
            "KUSTO_AUTH_METHOD=azure-identity",
            "KUSTO_ALLOW_WRITE_OPERATIONS=false",
            "KUSTO_CLUSTER_URL=${AZKUSTO_CLUSTER_URL}",
            "KUSTO_DEFAULT_DATABASE=${AZKUSTO_DATABASE}",
            "AZURE_TENANT_ID=${AZKUSTO_TENANT_ID}",
            "AZURE_CLIENT_ID=${AZKUSTO_CLIENT_ID}",
            "AZURE_CLIENT_SECRET=${AZKUSTO_CLIENT_SECRET}",
            "npx",
            "-y",
            "kusto-mcp",
          ]
        env:
          AZKUSTO_CLUSTER_URL:
          AZKUSTO_DATABASE:
          AZKUSTO_TENANT_ID:
          AZKUSTO_CLIENT_ID:
          AZKUSTO_CLIENT_SECRET:
    skills:
      - name: multi-stage-dockerfile
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/multi-stage-dockerfile"

      - name: devcontainer-setup
        source: community
        repo: "https://github.com/trailofbits/skills"
        path: "plugins/devcontainer-setup/skills/devcontainer-setup"

      - name: helm-chart-scaffolding
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/kubernetes-operations/skills/helm-chart-scaffolding"

      - name: kubernetes-specialist
        source: community
        repo: "https://github.com/jeffallan/claude-skills"
        path: "skills/kubernetes-specialist"

      - name: ci-cd-and-automation
        source: community
        repo: "https://github.com/addyosmani/agent-skills"
        path: "skills/ci-cd-and-automation"

      # Needs the `az` CLI plus `az extension add --name azure-devops`
      # (one-time, not tracked in bundles.yaml).
      - name: azure-devops-cli
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/azure-devops-cli"

  # ---------------------------------------------------------------------------
  # research — reference-library and notebook MCP servers: Zotero library
  # search and Google's NotebookLM.
  # ---------------------------------------------------------------------------
  - name: research
    description: Research and reference MCP servers — Zotero library search and Google NotebookLM
    version: "0.1.0"
    catalog: true
    mcp:
      # zotero-mcp (PyPI zotero-mcp, MIT). Defaults to local mode
      # (ZOTERO_LOCAL=true hardcoded — a mode flag, not a secret) talking to
      # a Zotero 7+ desktop app locally, needing zero credentials. The Web
      # API vars below are only for remote/no-desktop-app setups; blank is
      # safe since local mode wins regardless.
      - name: zotero
        command: env
        args:
          [
            "ZOTERO_LOCAL=true",
            "ZOTERO_API_KEY=${ZOTERO_API_KEY}",
            "ZOTERO_LIBRARY_ID=${ZOTERO_LIBRARY_ID}",
            "ZOTERO_LIBRARY_TYPE=${ZOTERO_LIBRARY_TYPE}",
            "zotero-mcp",
          ]
        env:
          ZOTERO_API_KEY:
          ZOTERO_LIBRARY_ID:
          ZOTERO_LIBRARY_TYPE:

      # Unified CLI + MCP server for Google's Gemini Notebook (NotebookLM).
      # `uv tool install notebooklm-mcp-cli` installs both an `nlm` CLI and
      # this server binary. Uses undocumented internal APIs — can break on a
      # Google-side change with no warning.
      #
      # No env var: run `nlm login` once (browser session, cookies persisted
      # by the CLI itself); re-run if cookies expire (~2-4 weeks).
      - name: notebooklm
        command: notebooklm-mcp

  # ---------------------------------------------------------------------------
  # web-search — semantic web search and page fetch, scraping, recent
  # public discussion, and YouTube search/lookup.
  # ---------------------------------------------------------------------------
  - name: web-search
    description: Web search, scraping, and discovery skills — Exa semantic search, Firecrawl, recent social discussion, and YouTube lookup
    version: "0.1.0"
    catalog: true
    mcp:
      # Semantic web search and page fetch via Exa's stdio MCP package.
      - name: exa
        command: npx
        args: ["-y", "exa-mcp-server"]
        env:
          EXA_API_KEY:
    skills:
      # Firecrawl's own umbrella skill — SKILL.md plus rules/. Deliberately
      # CLI + skill instead of Firecrawl's own MCP server: the skill teaches
      # the flags and the CLI returns markdown sized for a context window,
      # where an MCP server would sit in every session's tool list.
      #
      # Auth is `firecrawl login --browser` (or --api-key), a one-time
      # interactive step like `gh auth login` — no env var to wire here.
      - name: firecrawl
        source: community
        repo: "https://github.com/firecrawl/cli"
        path: "skills/firecrawl"

      # Its own script reads the bare SCRAPECREATORS_API_KEY straight from
      # the process environment (not through Claude Code's ${VAR}
      # substitution, which only applies to mcp: entries) — the name below
      # must match exactly, no prefix. SKILL.md documents 13 more optional
      # provider keys beyond this primary one; add one here only if needed.
      - name: last30days
        source: community
        repo: "https://github.com/mvanhorn/last30days-skill"
        path: "skills/last30days"
        env:
          SCRAPECREATORS_API_KEY:

      # Generic YouTube search/channel-fetch primitive via the yt-dlp CLI —
      # see the yt-dlp CLI itself, installed separately (not tracked in
      # bundles.yaml this round).
      - name: search-yt-dlp
        source: local

  # ---------------------------------------------------------------------------
  # browser — general browser automation via the Playwright CLI's own
  # plan/generate/heal workflow. CLI-driven, not an always-on MCP server —
  # live exploratory browser/DOM control stays opt-in by nature.
  # ---------------------------------------------------------------------------
  - name: browser
    description: Browser automation skill — general actions via the Playwright CLI
    version: "0.1.0"
    skills:
      - name: playwright-cli
        source: community
        repo: "https://github.com/microsoft/playwright-cli"
        path: "skills/playwright-cli"

  # ---------------------------------------------------------------------------
  # integrations — every MCP server, every CLI that substitutes for one (with
  # its own skill), and every skill needing an externally-sourced credential,
  # in one place — so a config panel (not plugin install/uninstall) can be
  # the unit of opt-in/opt-out per integration. See
  # docs/spec-integrations-bundle.md. gh, yt-dlp, firecrawl, and
  # playwright-cli are real global CLI installs tracked via deps: below,
  # alongside az (shared by azcloud/azdevops/azaks/azure-devops-cli).
  # ---------------------------------------------------------------------------
  - name: integrations
    description: Every MCP server, CLI-as-MCP tool, and credentialed integration in the marketplace, in one opt-in-able place
    version: "0.1.0"
    catalog: true
    mcp:
      # Keyless on the free tier (lower rate limits); no env var required.
      - name: context7
        command: npx
        args: ["-y", "@upstash/context7-mcp"]

      # zotero-mcp (PyPI zotero-mcp, MIT). Defaults to local mode
      # (ZOTERO_LOCAL=true hardcoded — a mode flag, not a secret) talking to
      # a Zotero 7+ desktop app locally, needing zero credentials. The Web
      # API vars below are only for remote/no-desktop-app setups; blank is
      # safe since local mode wins regardless.
      - name: zotero
        command: env
        args:
          [
            "ZOTERO_LOCAL=true",
            "ZOTERO_API_KEY=${ZOTERO_API_KEY}",
            "ZOTERO_LIBRARY_ID=${ZOTERO_LIBRARY_ID}",
            "ZOTERO_LIBRARY_TYPE=${ZOTERO_LIBRARY_TYPE}",
            "zotero-mcp",
          ]
        env:
          ZOTERO_API_KEY:
          ZOTERO_LIBRARY_ID:
          ZOTERO_LIBRARY_TYPE:

      # Unified CLI + MCP server for Google's Gemini Notebook (NotebookLM).
      # `uv tool install notebooklm-mcp-cli` installs both an `nlm` CLI and
      # this server binary. Uses undocumented internal APIs — can break on a
      # Google-side change with no warning.
      #
      # No env var: run `nlm login` once (browser session, cookies persisted
      # by the CLI itself); re-run if cookies expire (~2-4 weeks).
      - name: notebooklm
        command: notebooklm-mcp

      # Semantic web search and page fetch via Exa's stdio MCP package.
      - name: exa
        command: npx
        args: ["-y", "exa-mcp-server"]
        env:
          EXA_API_KEY:

      # Postgres-only, query-plan analysis + index tuning. Docker-only —
      # `uvx postgres-mcp` has an upstream bug.
      #
      # --access-mode=restricted is load-bearing: a second SQL validator
      # rejects writes before Postgres sees them, independent of the DB
      # role's own grant.
      #
      # The container's own env var name (DATABASE_URI) is fixed upstream,
      # so the rename happens inline in args instead.
      - name: pgquery
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "DATABASE_URI=${PGQUERY_URI}",
            "crystaldba/postgres-mcp",
            "--access-mode=restricted",
            "--transport=stdio",
          ]
        env:
          PGQUERY_URI:

      # Multi-engine (Postgres/MySQL/MSSQL/BigQuery/...), configured via a
      # tools.yaml mounted into the container — inherently user-specific, so
      # this repo can't ship one. Point DBTOOLS_CONFIG_PATH at your own
      # (absolute path — docker bind mounts reject relative ones).
      # Format: https://googleapis.github.io/genai-toolbox/
      - name: dbtools
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-v",
            "${DBTOOLS_CONFIG_PATH}:/tools.yaml:ro",
            "us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest",
            "--stdio",
            "--config",
            "/tools.yaml",
          ]
        env:
          DBTOOLS_CONFIG_PATH:

      # Dedicated MySQL (benborla/mcp-server-mysql, MIT) — an app-level
      # write gate independent of the DB grant, same pattern as pgquery's
      # --access-mode. No published image; Dockerfile vendored at
      # docker/mysql-mcp/ (pinned commit — see that file). Build once:
      #   docker build -t indie-marketplace-mysql-mcp:local plugins/integrations/docker/mysql-mcp
      #
      # ALLOW_*_OPERATION flags are hardcoded false here, overriding the
      # image's own true defaults — non-configurable by design.
      - name: mysql-mcp
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "MYSQL_HOST=${MYSQL_MCP_HOST}",
            "-e",
            "MYSQL_USER=${MYSQL_MCP_USER}",
            "-e",
            "MYSQL_PASS=${MYSQL_MCP_PASS}",
            "-e",
            "MYSQL_DB=${MYSQL_MCP_DB}",
            "-e",
            "ALLOW_INSERT_OPERATION=false",
            "-e",
            "ALLOW_UPDATE_OPERATION=false",
            "-e",
            "ALLOW_DELETE_OPERATION=false",
            "indie-marketplace-mysql-mcp:local",
          ]
        env:
          MYSQL_MCP_HOST:
          MYSQL_MCP_USER:
          MYSQL_MCP_PASS:
          MYSQL_MCP_DB:

      # Dedicated MSSQL (JexinSam/mssql_mcp_server, MIT) — query_sql regex-
      # gates to SELECT/WITH/SHOW; execute_sql stays unrestricted upstream,
      # so treat this as read-mostly, not read-only. No published image;
      # Dockerfile vendored at docker/mssql-mcp/ (pinned commit, also fixes
      # an upstream build bug). Build once:
      #   docker build -t indie-marketplace-mssql-mcp:local plugins/integrations/docker/mssql-mcp
      - name: mssql-mcp
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "MSSQL_HOST=${MSSQL_MCP_HOST}",
            "-e",
            "MSSQL_DATABASE=${MSSQL_MCP_DATABASE}",
            "-e",
            "MSSQL_USER=${MSSQL_MCP_USER}",
            "-e",
            "MSSQL_PASSWORD=${MSSQL_MCP_PASSWORD}",
            "indie-marketplace-mssql-mcp:local",
          ]
        env:
          MSSQL_MCP_HOST:
          MSSQL_MCP_DATABASE:
          MSSQL_MCP_USER:
          MSSQL_MCP_PASSWORD:

      # Official Azure MCP server (microsoft/mcp), 40+ services. Auth via
      # an existing `az login` session — no env var.
      - name: azcloud
        command: npx
        args: ["-y", "@azure/mcp@latest", "server", "start"]

      # Official Azure DevOps MCP server (microsoft/azure-devops-mcp). Org
      # name is a required positional arg, injected via ${...}.
      # --authentication azcli reuses the same `az login` session as
      # azcloud (upstream default is an interactive browser sign-in).
      - name: azdevops
        command: npx
        args:
          [
            "-y",
            "@azure-devops/mcp",
            "${AZDEVOPS_ORG}",
            "--authentication",
            "azcli",
          ]
        env:
          AZDEVOPS_ORG:

      # Official AKS MCP server (Azure/aks-mcp) — a Go binary with no npm
      # package; download a release from
      # https://github.com/Azure/aks-mcp/releases/latest and point
      # AZAKS_BIN at it. Auth: `az login` + kubeconfig, readonly by default.
      - name: azaks
        command: "${AZAKS_BIN}"
        args: ["--transport", "stdio"]
        env:
          AZAKS_BIN:

      # Azure Data Explorer / Kusto (johnib/kusto-mcp, npm) — picked over
      # pab1it0/adx-mcp-server, which hands raw queries straight to the
      # Kusto SDK with no read-only layer.
      #
      # KUSTO_ALLOW_WRITE_OPERATIONS=false is load-bearing: upstream
      # defaults it true; setting it false enables a real validator
      # rejecting every dot-command except the introspective .show family.
      #
      # Auth: fill in the three service-principal vars for an unattended
      # identity, or leave them blank to fall through to managed identity
      # then the same `az login` session azcloud/azdevops use.
      #
      # Caveat: reports anonymous usage telemetry to the maintainer (tool
      # names, latency, salted tenant/user hashes — never query text or
      # results); redirectable to your own OTLP collector, not disable-able.
      - name: azkusto
        command: env
        args:
          [
            "KUSTO_AUTH_METHOD=azure-identity",
            "KUSTO_ALLOW_WRITE_OPERATIONS=false",
            "KUSTO_CLUSTER_URL=${AZKUSTO_CLUSTER_URL}",
            "KUSTO_DEFAULT_DATABASE=${AZKUSTO_DATABASE}",
            "AZURE_TENANT_ID=${AZKUSTO_TENANT_ID}",
            "AZURE_CLIENT_ID=${AZKUSTO_CLIENT_ID}",
            "AZURE_CLIENT_SECRET=${AZKUSTO_CLIENT_SECRET}",
            "npx",
            "-y",
            "kusto-mcp",
          ]
        env:
          AZKUSTO_CLUSTER_URL:
          AZKUSTO_DATABASE:
          AZKUSTO_TENANT_ID:
          AZKUSTO_CLIENT_ID:
          AZKUSTO_CLIENT_SECRET:

      # Live exploratory browser/DOM control — opt-in by nature. A plugin's
      # .mcp.json servers all activate together on install, so this used to
      # need its own plugin (browser-mcp) to stay separate from the
      # always-on browser CLI skills below.
      - name: playwright
        command: npx
        args: ["-y", "@playwright/mcp@latest"]
    skills:
      # Firecrawl's own umbrella skill — SKILL.md plus rules/. Deliberately
      # CLI + skill instead of Firecrawl's own MCP server: the skill teaches
      # the flags and the CLI returns markdown sized for a context window,
      # where an MCP server would sit in every session's tool list.
      #
      # Auth is `firecrawl login --browser` (or --api-key), a one-time
      # interactive step like `gh auth login` — no env var to wire here.
      - name: firecrawl
        source: community
        repo: "https://github.com/firecrawl/cli"
        path: "skills/firecrawl"

      # Its own script reads the bare SCRAPECREATORS_API_KEY straight from
      # the process environment (not through Claude Code's ${VAR}
      # substitution, which only applies to mcp: entries) — the name below
      # must match exactly, no prefix. SKILL.md documents 13 more optional
      # provider keys beyond this primary one; add one here only if needed.
      - name: last30days
        source: community
        repo: "https://github.com/mvanhorn/last30days-skill"
        path: "skills/last30days"
        env:
          SCRAPECREATORS_API_KEY:

      # YouTube search/lookup primitive via the yt-dlp CLI (query search,
      # single-video lookup, optional transcript fetch) — see deps: below
      # for the CLI itself.
      - name: yt-dlp
        source: local

      # Upstream's own CLI + skill: general browser actions plus its own
      # CLI-driven plan/generate/heal workflow — see deps: below for the
      # CLI itself.
      - name: playwright-cli
        source: community
        repo: "https://github.com/microsoft/playwright-cli"
        path: "skills/playwright-cli"

      # See deps: below (az) for the CLI itself, plus
      # `az extension add --name azure-devops` (one-time, not tracked here).
      - name: azure-devops-cli
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/azure-devops-cli"
    deps:
      # gh has no skill of its own — a bare catalog entry instead of a
      # hand-authored one. `gh auth login` stays manual.
      - command: gh
        install: brew install gh
        manual: "https://github.com/cli/cli#installation"

      - command: yt-dlp
        install: brew install yt-dlp
        manual: "https://github.com/yt-dlp/yt-dlp#installation"

      - command: firecrawl
        install: npm install -g firecrawl-cli@latest
        manual: "https://docs.firecrawl.dev/sdks/cli"

      - command: playwright-cli
        install: npm install -g @playwright/cli@latest
        manual: "https://github.com/microsoft/playwright-cli"

      # Shared by azcloud/azdevops/azaks above (their MCP servers reuse an
      # existing `az login` session) and azure-devops-cli's own skill.
      - command: az
        install: brew install azure-cli
        manual: "https://learn.microsoft.com/cli/azure/install-azure-cli"

  # ---------------------------------------------------------------------------
  # codementor — git workflow and code review hygiene skills.
  # ---------------------------------------------------------------------------
  - name: codementor
    description: Git workflow and code review skills — cleanup, commit hygiene, and review excellence
    version: "0.1.0"
    skills:
      - name: git-cleanup
        source: community
        repo: "https://github.com/trailofbits/skills"
        path: "plugins/git-cleanup/skills/git-cleanup"

      - name: code-review-excellence
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/developer-essentials/skills/code-review-excellence"

      - name: git-commit
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/git-commit"

  # ---------------------------------------------------------------------------
  # superpowers — obra's methodology skills library (TDD, systematic
  # debugging, brainstorming, code review, plans, git worktrees, ...) plus
  # its SessionStart hook, which injects the 'using-superpowers' skill into
  # every session/clear/compact, pushing Claude to check for a matching
  # skill before responding. Both skills and hooks/ are fetched verbatim
  # from upstream — no hand-maintained copies.
  # ---------------------------------------------------------------------------
  - name: superpowers
    description: obra's methodology skills (TDD, debugging, brainstorming, code review, plans) with session-start skill-enforcement hook
    version: "0.1.0"
    hooks:
      source: community
      repo: "https://github.com/obra/superpowers"
      path: "hooks"
    skills:
      - name: obra-superpowers
        source: community
        repo: "https://github.com/obra/superpowers"
        path: "skills/*"

  # ---------------------------------------------------------------------------
  # essentials — the always-on baseline: session lifecycle hooks plus the
  # handful of skills reached for in nearly every project.
  # Note: hooks/ and scripts/ here are maintained by hand, not generated by
  # build.py — there is no `hooks:` block because nothing is fetched upstream.
  # ---------------------------------------------------------------------------
  - name: essentials
    description: Always-on baseline — session lifecycle hooks plus everyday grilling, handoff, onboarding, and terse-mode skills
    version: "0.1.0"
    skills:
      # Custom skills (source of truth is skills/ in this repo)
      - name: onboard-project
        source: local

      # Community skills (git-cloned on make fetch / make fetch-build)
      - name: grill-me
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/productivity/grill-me"

      - name: grilling
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/productivity/grilling"

      - name: handoff
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/productivity/handoff"

      - name: caveman
        source: community
        repo: "https://github.com/juliusbrussee/caveman"
        path: "skills/caveman"

      - name: teach
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/productivity/teach"
