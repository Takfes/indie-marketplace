  # ---------------------------------------------------------------------------
  # database — SQL and data engineering skills: query review and
  # optimization (awesome-copilot), Azure Kusto queries (azure-skills),
  # and profiling tables (astronomer).
  # ---------------------------------------------------------------------------
  - name: database
    description: SQL and data engineering skills — query review, optimization, Azure Kusto, and table profiling
    version: "0.1.0"
    mcp:
      # Postgres-only server with query-plan analysis and index tuning.
      # Docker is the only working distribution — `uvx postgres-mcp` has an
      # upstream bug (see NEXTME.md), so there is no non-container path.
      #
      # --access-mode=restricted is load-bearing, not decoration: the server
      # runs its own SQL validator that rejects writes before they ever reach
      # Postgres, independent of whatever the DB role happens to grant. That
      # second layer is the reason to use this over a plain DB client.
      #
      # The container expects its connection string in DATABASE_URI, a fixed
      # internal name that cannot carry this repo's mandatory DATABASE_ prefix
      # convention as its own. Rather than fight the prefix rule, the rename
      # happens inline in args: Claude Code expands ${...} inside args before
      # exec'ing docker, so the container receives DATABASE_URI while this repo
      # only ever declares the prefixed DATABASE_PGQUERY_URI.
      - name: pgquery
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "DATABASE_URI=${DATABASE_PGQUERY_URI}",
            "crystaldba/postgres-mcp",
            "--access-mode=restricted",
            "--transport=stdio",
          ]
        env:
          DATABASE_PGQUERY_URI:

      # Multi-engine server (Postgres, MySQL, SQL Server, BigQuery, ...).
      # Unlike pgquery it takes no per-database env vars at all: every source
      # and every exposed SQL tool is declared in a tools.yaml config file
      # mounted into the container.
      #
      # That file is inherently user-specific — it names the databases you
      # personally query and the tools you want exposed over them — so this
      # repo cannot ship one. The single declared env var is therefore a
      # filesystem path, not a credential: point DATABASE_DBTOOLS_CONFIG_PATH
      # at a tools.yaml you write yourself. It must be an absolute path;
      # docker bind mounts reject relative ones.
      # Format reference: https://googleapis.github.io/genai-toolbox/
      - name: dbtools
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-v",
            "${DATABASE_DBTOOLS_CONFIG_PATH}:/tools.yaml:ro",
            "us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest",
            "--stdio",
            "--config",
            "/tools.yaml",
          ]
        env:
          DATABASE_DBTOOLS_CONFIG_PATH:
    skills:
      - name: sql-code-review
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/sql-code-review"

      - name: sql-optimization
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/sql-optimization"

      - name: azure-kusto
        source: community
        repo: "https://github.com/microsoft/azure-skills"
        path: "skills/azure-kusto"

      - name: profiling-tables
        source: community
        repo: "https://github.com/astronomer/agents"
        path: "skills/profiling-tables"

  # ---------------------------------------------------------------------------
  # azdevops — containers, Kubernetes, CI/CD, and Azure DevOps skills.
  # ---------------------------------------------------------------------------
  - name: azdevops
    description: DevOps and infrastructure skills — containers, Kubernetes, CI/CD, and Azure DevOps
    version: "0.1.0"
    mcp:
      # Official Azure MCP Server (microsoft/mcp, servers/Azure.Mcp.Server —
      # the archived Azure/azure-mcp repo folded into that monorepo). Covers
      # 40+ Azure services for resource management. Authenticates through the
      # Azure Identity SDK off an existing `az login` session, so no
      # credential is ever passed to the server and it declares no env var.
      - name: azcloud
        command: npx
        args: ["-y", "@azure/mcp@latest", "server", "start"]

      # Official Microsoft Azure DevOps MCP Server (microsoft/azure-devops-mcp),
      # not one of the older community forks. The organization name is a
      # required positional arg with no env-var equivalent upstream, so it is
      # injected via ${...} in args — Claude Code expands those before spawning
      # the server. `--authentication azcli` reuses the same `az login` session
      # as the other two servers; the upstream default is `interactive`, a
      # browser sign-in that suits a stdio subprocess poorly.
      - name: azdevops
        command: npx
        args:
          [
            "-y",
            "@azure-devops/mcp",
            "${AZDEVOPS_AZDEVOPS_ORG}",
            "--authentication",
            "azcli",
          ]
        env:
          AZDEVOPS_AZDEVOPS_ORG:

      # Official AKS MCP server (Azure/aks-mcp). A Go binary with no npm
      # package, and upstream supports only a locally-spawned stdio process —
      # it explicitly rules out running behind a container service — so the
      # user downloads a release binary from
      # https://github.com/Azure/aks-mcp/releases/latest and points the env var
      # below at it. Auth is the user's own `az login` plus kubeconfig; the
      # access level defaults to readonly upstream.
      - name: azaks
        command: "${AZDEVOPS_AZAKS_BIN}"
        args: ["--transport", "stdio"]
        env:
          AZDEVOPS_AZAKS_BIN:

      # Azure Data Explorer / Kusto (johnib/kusto-mcp, npm). Picked over the
      # better-known pab1it0/adx-mcp-server because that one hands the raw
      # query string straight to the Kusto SDK's execute(), which routes
      # anything starting with "." to the management endpoint — .drop,
      # .ingest and .set-or-replace all go through. It has no read-only layer
      # at all, only whatever the Azure role happens to deny. The npm
      # @mcp-apps/kusto-mcp-server publishes no source repo, so its read-only
      # claim cannot be audited either.
      #
      # KUSTO_ALLOW_WRITE_OPERATIONS=false is this entry's equivalent of
      # pgquery's --access-mode=restricted, and is load-bearing for the same
      # reason: upstream defaults it to *true*, and setting it false enables a
      # real validator that rejects every dot-command except the introspective
      # .show family before it reaches the cluster. Plain KQL cannot mutate,
      # so that pair is the whole write surface. Verified live — with this set
      # the server logs "Running in READ-ONLY mode" on startup.
      #
      # Auth is the third distinct credential style in this plugin: not
      # azdevops' org string, not azaks' local binary, but the Azure
      # Identity chain (KUSTO_AUTH_METHOD=azure-identity →
      # DefaultAzureCredential). Fill in the three service-principal vars for
      # an unattended identity; leave them blank and the chain falls through
      # to managed identity and then to the same `az login` session this
      # plugin's other servers use. Blank is safe — the SDK gates the service
      # principal on a plain truthiness check, so empty strings read as unset.
      #
      # The server takes no CLI flags (everything is env) and its internal
      # names carry no AZDEVOPS_ prefix, so `env` does the rename inline, the
      # way pgquery's `docker -e` does in the database plugin. Claude Code
      # expands ${...} in args. Cluster URL and database are both required
      # for auto-connect; without them every session has to call
      # initialize-connection by hand.
      #
      # Caveat: kusto-mcp reports anonymous usage telemetry to the maintainer
      # (tool names, latency, error classes, salted tenant/user hashes — never
      # query text, results, or cluster/table names). It cannot be disabled,
      # only redirected to your own OTLP collector.
      - name: azkusto
        command: env
        args:
          [
            "KUSTO_AUTH_METHOD=azure-identity",
            "KUSTO_ALLOW_WRITE_OPERATIONS=false",
            "KUSTO_CLUSTER_URL=${AZDEVOPS_AZKUSTO_CLUSTER_URL}",
            "KUSTO_DEFAULT_DATABASE=${AZDEVOPS_AZKUSTO_DATABASE}",
            "AZURE_TENANT_ID=${AZDEVOPS_AZKUSTO_TENANT_ID}",
            "AZURE_CLIENT_ID=${AZDEVOPS_AZKUSTO_CLIENT_ID}",
            "AZURE_CLIENT_SECRET=${AZDEVOPS_AZKUSTO_CLIENT_SECRET}",
            "npx",
            "-y",
            "kusto-mcp",
          ]
        env:
          AZDEVOPS_AZKUSTO_CLUSTER_URL:
          AZDEVOPS_AZKUSTO_DATABASE:
          AZDEVOPS_AZKUSTO_TENANT_ID:
          AZDEVOPS_AZKUSTO_CLIENT_ID:
          AZDEVOPS_AZKUSTO_CLIENT_SECRET:
    skills:
      - name: multi-stage-dockerfile
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/multi-stage-dockerfile"

      - name: devcontainer-setup
        source: community
        repo: "https://github.com/trailofbits/skills"
        path: "plugins/devcontainer-setup/skills/devcontainer-setup"

      - name: helm-chart-scaffolding
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/kubernetes-operations/skills/helm-chart-scaffolding"

      - name: kubernetes-specialist
        source: community
        repo: "https://github.com/jeffallan/claude-skills"
        path: "skills/kubernetes-specialist"

      - name: azure-devops-cli
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/azure-devops-cli"

      - name: ci-cd-and-automation
        source: community
        repo: "https://github.com/addyosmani/agent-skills"
        path: "skills/ci-cd-and-automation"

