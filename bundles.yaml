# =============================================================================
# bundles.yaml — indie marketplace configuration
# =============================================================================
# Single source of truth for what goes into each plugin.
#
# plugin.source values:
#   (omitted) — built locally from skills/ entries below
#   external  — third-party plugin repo; referenced in marketplace.json only,
#               never built locally. Fields: url, description, version.
#
# skill.source values (for locally-built plugins only):
#   local     — skill lives in skills/<name>/ in this repo (you own it)
#   community — fetched from a git repo at build time
#               repo: git URL to clone
#               path: subdirectory inside the repo (defaults to skill name).
#                     End path in "/*" (or use "*" alone for the repo root)
#                     to fetch every skill directory found directly under
#                     it as its own skill, instead of naming one explicitly.
#                     `name` becomes just a log label for these entries.
#
# plugin.hooks (optional, top-level sibling of `skills:`):
#   Same idea as a community skill, but fetches a hooks/ directory verbatim
#   instead of a skill. Fields: source: community, repo:, path: (defaults
#   to "hooks"). Refreshed by the same make fetch / make fetch-build run as
#   the plugin's skills — no separate command.
#
# plugin.mcp (optional, top-level sibling of `skills:`, list):
#   Hand-authored MCP server declarations — no `community` fetch variant,
#   since these are written directly against the upstream MCP package
#   rather than pulled from a third-party skills repo. Each entry becomes
#   one server in the plugin's generated .mcp.json. Fields:
#     name    — server key under mcpServers
#     command — executable to run
#     args    — list of CLI args (defaults to [])
#     env     — optional map of required env var names. Only the names
#               matter here — leave values blank/null; build.py writes
#               each as "${NAME}" in .mcp.json so Claude Code resolves it
#               from the user's shell environment at runtime. Actual
#               defaults/examples belong in .env.example, generated
#               separately — not hand-written here.
#
#               Every name MUST start with its own plugin's name, uppercased,
#               hyphens turned into underscores, followed by an underscore:
#               plugin `python` → PYTHON_API_KEY, plugin `web-research` →
#               WEB_RESEARCH_API_KEY. build.py rejects the build outright if a
#               declared name is missing its prefix. This is not cosmetic:
#               every var, whichever file it came from, ends up in Claude
#               Code's single process environment, so two plugins both
#               declaring a bare API_KEY would silently clobber each other.
#               The prefix makes that collision impossible to express.
#
# Env var files (per plugin, at the plugin root — two files, one job each):
#   .env.example — generated by build.py from the `env` names above, values
#                  left empty. Committed; contains no secrets by construction.
#   .env         — the user's real values, hand-maintained by copying
#                  .env.example and filling it in. Never committed (.gitignore
#                  excludes .env everywhere) and never read or written by
#                  build.py. plugins/essentials/scripts/load-env.sh sources
#                  every installed plugin's .env and refuses to continue if
#                  two of them declare the same bare variable name — the
#                  runtime backstop for the prefix rule above.
#
# To add a skill:          add an entry under the plugin's skills list, run build.py
# To add a local plugin:   add a new block under plugins (no source:), run build.py
# To add external plugin:  add a block with source: external + url:, run build.py
# To add an MCP server:    add an entry under the plugin's mcp list, run build.py
# =============================================================================

marketplace:
  name: indie-marketplace
  description: Personal AI skills marketplace
  owner:
    name: Takis Fessas
    url: https://github.com/Takfes

plugins:
  # ---------------------------------------------------------------------------
  # provision — AI toolkit meta-skills
  # Skills for managing, creating, and distributing other skills and agents.
  # ---------------------------------------------------------------------------
  - name: provision
    description: AI toolkit provisioning and meta-skills
    version: "0.1.0"
    color: "#1a1a1a"
    skills:
      # Custom skills (source of truth is skills/ in this repo)
      - name: skill-bundler
        source: local

      - name: skill-downloader
        source: local

      - name: runtime-doctor
        source: local

      # Community skills (git-cloned on make fetch / make fetch-build)
      - name: skill-creator
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/skill-creator"

      - name: find-skills
        source: community
        repo: "https://github.com/vercel-labs/skills"
        path: "skills/find-skills"

      - name: agent-development
        source: community
        repo: "https://github.com/anthropics/claude-code"
        path: "plugins/plugin-dev/skills/agent-development"

  # ---------------------------------------------------------------------------
  # python — Python development skills
  # ---------------------------------------------------------------------------
  - name: python
    description: Python development, packaging, testing, and refactoring skills
    version: "0.1.0"
    mcp:
      # Up-to-date, version-specific library docs. Works fully keyless on
      # the free tier (lower rate limits); no env var is required.
      - name: context7
        command: npx
        args: ["-y", "@upstash/context7-mcp"]
    skills:
      - name: python-packaging
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/python-development/skills/python-packaging"

      # Originally fetched from community (https://github.com/wshobson/agents,
      # plugins/python-development/skills/python-performance-optimization);
      # now customized and hand-maintained — see
      # skills/python-performance-optimization/ for the source of truth.
      - name: python-performance-optimization
        source: local

      - name: python-refactor
        source: community
        repo: "https://github.com/acaprino/alfio-claude-plugins"
        path: "plugins/python-development/skills/python-refactor"

      - name: python-simplifier
        source: community
        repo: "https://github.com/charlesmsiegel/tg"
        path: ".claude/skills/python-simplifier"

      # Originally fetched from community (https://github.com/wshobson/agents,
      # plugins/python-development/skills/python-testing-patterns); now
      # synthesized with TDD methodology from the mattpocock and superpowers
      # tdd skills and hand-maintained — see
      # skills/python-testing-patterns/ for the source of truth.
      - name: python-testing-patterns
        source: local

      - name: uv-package-manager
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/python-development/skills/uv-package-manager"

  # ---------------------------------------------------------------------------
  # steering — thinking, planning, and ideation skills
  # A mix of custom skills and community-sourced skills for structured thinking,
  # planning, and decision-making.
  # ---------------------------------------------------------------------------
  - name: steering
    description: Thinking, planning, and ideation skills — custom and community-sourced
    version: "0.1.0"
    skills:
      # Custom skills (source of truth is skills/ in this repo)
      - name: clarity
        source: local

      - name: devils-advocate
        source: local

      - name: plan-and-critique
        source: local

      # Community skills (git-cloned on make fetch / make fetch-build)
      - name: llm-council
        source: community
        repo: "https://github.com/aiwithremy/claude-skills-llm-council"
        path: "."

      - name: prd
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/prd"

      - name: claude-handoff
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/in-progress/claude-handoff"

      - name: claude-loop-engineering
        source: community
        repo: "https://github.com/iamarvindh/claude-loop-engineering"
        path: "skill"

      - name: doc-coauthoring
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/doc-coauthoring"

  # ---------------------------------------------------------------------------
  # mattpocock — Matt Pocock's engineering / spec-driven-development skills
  # ---------------------------------------------------------------------------
  - name: mattpocock
    description: Matt Pocock's engineering skills — spec-driven development, TDD, code review, architecture
    version: "0.1.0"
    skills:
      # Wildcard group entry: fetches every skill directory found directly
      # under skills/engineering/ in one clone (see bundles.yaml header).
      - name: mattpocock-engineering
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/engineering/*"

  # ---------------------------------------------------------------------------
  # research — research and knowledge-synthesis skills. WIP: notebooklm and
  # zotero MCP servers are planned here but not yet ticketed — teach is the
  # only entry for now.
  # ---------------------------------------------------------------------------
  - name: research
    description: Research and knowledge-synthesis skills (WIP)
    version: "0.1.0"
    skills:
      - name: teach
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/productivity/teach"

  # ---------------------------------------------------------------------------
  # office — Anthropic's document-format skills for creating and editing
  # Office/PDF documents (docx, pdf, pptx, xlsx).
  # ---------------------------------------------------------------------------
  - name: office
    description: Create and edit Office documents — docx, pdf, pptx, and xlsx
    version: "0.1.0"
    skills:
      - name: docx
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/docx"

      - name: pdf
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/pdf"

      - name: pptx
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/pptx"

      - name: xlsx
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/xlsx"

  # ---------------------------------------------------------------------------
  # frontend — frontend design and UI craft skills: layout/UX design
  # (Anthropic), production frontend iteration (impeccable), and anti-slop
  # design taste for landing pages/portfolios (taste-skill).
  # ---------------------------------------------------------------------------
  - name: frontend
    description: Frontend design and UI craft skills — design, iterate, and critique frontend interfaces
    version: "0.1.0"
    skills:
      - name: frontend-design
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/frontend-design"

      - name: impeccable
        source: community
        repo: "https://github.com/pbakaus/impeccable"
        path: ".claude/skills/impeccable"

      - name: design-taste-frontend
        source: community
        repo: "https://github.com/leonxlnx/taste-skill"
        path: "skills/taste-skill"

  # ---------------------------------------------------------------------------
  # database — SQL and data engineering skills: query review and
  # optimization (awesome-copilot), Azure Kusto queries (azure-skills),
  # and profiling tables (astronomer).
  # ---------------------------------------------------------------------------
  - name: database
    description: SQL and data engineering skills — query review, optimization, Azure Kusto, and table profiling
    version: "0.1.0"
    skills:
      - name: sql-code-review
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/sql-code-review"

      - name: sql-optimization
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/sql-optimization"

      - name: azure-kusto
        source: community
        repo: "https://github.com/microsoft/azure-skills"
        path: "skills/azure-kusto"

      - name: profiling-tables
        source: community
        repo: "https://github.com/astronomer/agents"
        path: "skills/profiling-tables"

  # ---------------------------------------------------------------------------
  # devops — containers, Kubernetes, CI/CD, and Azure DevOps skills.
  # ---------------------------------------------------------------------------
  - name: devops
    description: DevOps and infrastructure skills — containers, Kubernetes, CI/CD, and Azure DevOps
    version: "0.1.0"
    skills:
      - name: multi-stage-dockerfile
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/multi-stage-dockerfile"

      - name: devcontainer-setup
        source: community
        repo: "https://github.com/trailofbits/skills"
        path: "plugins/devcontainer-setup/skills/devcontainer-setup"

      - name: helm-chart-scaffolding
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/kubernetes-operations/skills/helm-chart-scaffolding"

      - name: kubernetes-specialist
        source: community
        repo: "https://github.com/jeffallan/claude-skills"
        path: "skills/kubernetes-specialist"

      - name: azure-devops-cli
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/azure-devops-cli"

      - name: ci-cd-and-automation
        source: community
        repo: "https://github.com/addyosmani/agent-skills"
        path: "skills/ci-cd-and-automation"

  # ---------------------------------------------------------------------------
  # gitctrl — git workflow and code review hygiene skills.
  # ---------------------------------------------------------------------------
  - name: gitctrl
    description: Git workflow and code review skills — cleanup, commit hygiene, and review excellence
    version: "0.1.0"
    skills:
      - name: git-cleanup
        source: community
        repo: "https://github.com/trailofbits/skills"
        path: "plugins/git-cleanup/skills/git-cleanup"

      - name: code-review-excellence
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/developer-essentials/skills/code-review-excellence"

      - name: git-commit
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/git-commit"

  # ---------------------------------------------------------------------------
  # superpowers — obra's methodology skills library (TDD, systematic
  # debugging, brainstorming, code review, plans, git worktrees, ...) plus
  # its SessionStart hook, which injects the 'using-superpowers' skill into
  # every session/clear/compact, pushing Claude to check for a matching
  # skill before responding. Both skills and hooks/ are fetched verbatim
  # from upstream — no hand-maintained copies.
  # ---------------------------------------------------------------------------
  - name: superpowers
    description: obra's methodology skills (TDD, debugging, brainstorming, code review, plans) with session-start skill-enforcement hook
    version: "0.1.0"
    hooks:
      source: community
      repo: "https://github.com/obra/superpowers"
      path: "hooks"
    skills:
      - name: obra-superpowers
        source: community
        repo: "https://github.com/obra/superpowers"
        path: "skills/*"

  # ---------------------------------------------------------------------------
  # essentials — the always-on baseline: session lifecycle hooks plus the
  # handful of skills reached for in nearly every project.
  # Note: hooks/ and scripts/ here are maintained by hand, not generated by
  # build.py — there is no `hooks:` block because nothing is fetched upstream.
  # ---------------------------------------------------------------------------
  - name: essentials
    description: Always-on baseline — session lifecycle hooks plus everyday grilling, handoff, onboarding, and terse-mode skills
    version: "0.1.0"
    skills:
      # Custom skills (source of truth is skills/ in this repo)
      - name: onboard-project
        source: local

      # Community skills (git-cloned on make fetch / make fetch-build)
      - name: grill-me
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/productivity/grill-me"

      - name: grilling
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/productivity/grilling"

      - name: handoff
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/productivity/handoff"

      - name: caveman
        source: community
        repo: "https://github.com/juliusbrussee/caveman"
        path: "skills/caveman"
