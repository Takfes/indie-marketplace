# =============================================================================
# bundles.yaml — indie marketplace configuration
# =============================================================================
# Single source of truth for what goes into each plugin.
#
# plugin.source values:
#   (omitted) — built locally from skills/ entries below
#   external  — third-party plugin repo; referenced in marketplace.json only,
#               never built locally. Fields: url, description, version.
#
# skill.source values (for locally-built plugins only):
#   local     — skill lives in skills/<name>/ in this repo (you own it)
#   community — fetched from a git repo at build time
#               repo: git URL to clone
#               path: subdirectory inside the repo (defaults to skill name).
#                     End path in "/*" (or use "*" alone for the repo root)
#                     to fetch every skill directory found directly under
#                     it as its own skill, instead of naming one explicitly.
#                     `name` becomes just a log label for these entries.
#
# plugin.hooks (optional, top-level sibling of `skills:`):
#   Same idea as a community skill, but fetches a hooks/ directory verbatim
#   instead of a skill. Fields: source: community, repo:, path: (defaults
#   to "hooks"). Refreshed by the same make fetch / make fetch-build run as
#   the plugin's skills — no separate command.
#
# plugin.mcp (optional, top-level sibling of `skills:`, list):
#   Hand-authored MCP server declarations. Each entry becomes one server in
#   the plugin's generated .mcp.json. Fields:
#     name    — server key under mcpServers
#     command — executable to run
#     args    — list of CLI args (defaults to [])
#     env     — optional map of env var names to metadata. An entry
#               declaring env gets a generated wrapper in the plugin's
#               bin/ (see "Credential wrappers" below) that resolves and
#               exports these before exec'ing `command`/`args` — .mcp.json
#               then points at the wrapper instead of substituting
#               "${NAME}" itself. Each value is either null (required,
#               undescribed — today's shape) or a mapping overriding
#               either field:
#                 env:
#                   PGQUERY_URI: null
#                   ZOTERO_API_KEY: { required: false, description: "…" }
#               Name it for whatever the entry actually needs — no
#               enforced prefix.
#
# plugin.env (optional, top-level sibling of `skills:`, map):
#   Env var names a plugin needs with no single mcp:/skills:/deps: entry to
#   attach to. Same shape as an mcp: entry's `env:`. Reaches .env.example
#   only — nothing here is written to .mcp.json or vscode-mcp.json, and it
#   gets no wrapper (there is no command to wrap it around).
#
# plugin.deps (optional, top-level sibling of `skills:`, list):
#   CLI tools a plugin's skills invoke directly, with no MCP server behind
#   them. Each entry:
#     command — the executable to look for on PATH (required)
#     install — shell command that installs it, shown as a suggestion only —
#               nothing here is ever run automatically
#     manual  — install docs URL, shown when there's no scripted `install`
#     env     — optional, same shape as an mcp: entry's `env:`. An entry
#               declaring env gets a generated scoped launcher in bin/
#               instead of an mcp: entry's wrapper — same credential
#               resolution, but it forwards its caller's own arguments to
#               `command` rather than running a fixed argv.
#   build.py copies command/install/manual verbatim into the plugin's
#   deps.json.
#
# Credential wrappers (generated bin/, one per plugin with a credential-
# bearing mcp:/deps: entry):
#   A copy of shared/resolver.py plus one wrapper (mcp:) or scoped launcher
#   (deps:) per entry declaring env. Each resolves its own declared vars via
#   the resolver, exports them, and execs the real command — so a secret
#   value is set via the process's environment, never passed as a `-e
#   NAME=value`-shaped argument, and is therefore invisible to another
#   user's `ps`. The resolver travels inside bin/ rather than being shared
#   from `essentials`, so a plugin installed alone still resolves its own
#   credentials.
#
# plugin.catalog (optional, top-level sibling of `skills:`, bool):
#   Set true to have build.py write catalog.json: one {name, type, env}
#   object per mcp:/skills:/deps: entry, env listing one
#   {name, required, description} object per variable (never values) —
#   for later tooling (secrets status, install checks) to read without a
#   YAML parser.
#
# plugin.vendor (optional, top-level sibling of `skills:`):
#   Whole-plugin vendoring: git-clones a third-party repo and copies one of
#   its plugin directories verbatim into this plugin's root — manifest,
#   LICENSE, NOTICE, and all — instead of cherry-picking individual skills.
#   A plugin with a `vendor:` block carries no `skills:`/`hooks:`/`mcp:`/
#   `env:`/`deps:` of its own; the vendored copy already ships everything it
#   needs, and build.py skips its usual owner-stamping of plugin.json so the
#   upstream author stays attributed. Fields:
#     repo — git URL to clone
#     path — subdirectory inside the repo containing the plugin
#     ref  — optional git tag/branch/sha to pin to (omit to track the
#            default branch)
#
# .env.example (per plugin, at the plugin root):
#   Generated by build.py from every `env:` above, values left empty, each
#   with its description (if any) and required/optional state as a comment.
#   Committed; contains no secrets by construction; documentation only —
#   real values are never read from or written to a file here. A user's
#   actual credentials live in one place, ~/.indie-marketplace/profiles.json,
#   edited through the secrets-manager skill's browser UI (essentials
#   plugin) rather than hand-copied from this file — see
#   docs/secrets-architecture.md.
#
# Env var names are global, not per-plugin: build.py fails the build if the
# same name is declared by more than one plugin (across any mcp:/skills:/
# deps:/env: entry), naming both plugins and both entries, so two tools can
# never silently share one credential.
#
# To add a skill:          add an entry under the plugin's skills list, run build.py
# To add a local plugin:   add a new block under plugins (no source:), run build.py
# To add external plugin:  add a block with source: external + url:, run build.py
# To add an MCP server:    add an entry under the plugin's mcp list, run build.py
# To add a CLI credential: add a name under the plugin's env map, run build.py
# To add a CLI dependency: add an entry under the plugin's deps list, run build.py
# To vendor a whole plugin: add a new block with a vendor: block, run build.py --fetch
# =============================================================================

marketplace:
  name: indie-marketplace
  description: Personal AI skills marketplace
  owner:
    name: Takis Fessas
    url: https://github.com/Takfes

plugins:
  # ---------------------------------------------------------------------------
  # skillcraft — AI toolkit meta-skills
  # Skills for managing, creating, and distributing other skills and agents.
  # ---------------------------------------------------------------------------
  - name: skillcraft
    description: AI toolkit provisioning and meta-skills
    version: "0.1.0"
    color: "#1a1a1a"
    skills:
      # Custom skills (source of truth is skills/ in this repo)
      - name: skill-bundler
        source: local

      - name: skill-downloader
        source: local

      # Community skills (git-cloned on make fetch / make fetch-build)
      - name: skill-creator
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/skill-creator"

      - name: find-skills
        source: community
        repo: "https://github.com/vercel-labs/skills"
        path: "skills/find-skills"

      - name: agent-development
        source: community
        repo: "https://github.com/anthropics/claude-code"
        path: "plugins/plugin-dev/skills/agent-development"

  # ---------------------------------------------------------------------------
  # pythonista — Python development skills
  # ---------------------------------------------------------------------------
  - name: pythonista
    description: Python development, packaging, testing, and refactoring skills
    version: "0.1.0"
    catalog: true
    mcp:
      # Keyless on the free tier (lower rate limits); no env var required.
      - name: context7
        command: npx
        args: ["-y", "@upstash/context7-mcp"]
    skills:
      # Originally fetched from community (https://github.com/wshobson/agents,
      # plugins/python-development/skills/python-packaging); now gains a CLI
      # surface-design section (argument ergonomics, not just entry-point
      # wiring) and is hand-maintained — see skills/python-packaging/ for
      # the source of truth.
      - name: python-packaging
        source: local

      # Originally fetched from community (https://github.com/wshobson/agents,
      # plugins/python-development/skills/python-performance-optimization);
      # now customized and hand-maintained — see
      # skills/python-performance-optimization/ for the source of truth.
      - name: python-performance-optimization
        source: local

      # Originally fetched from community (https://github.com/acaprino/alfio-claude-plugins,
      # plugins/python-development/skills/python-refactor); now trimmed to
      # structural moves only and hand-maintained — see
      # skills/python-refactor/ for the source of truth.
      - name: python-refactor
        source: local

      # Layer 0 of the pythonista pipeline — deterministic analyzers only.
      # Consolidated from python-simplifier's and python-refactor's own
      # analyzer scripts — see skills/python-scan/ for the source of truth.
      - name: python-scan
        source: local

      # Layer 1 (judgment) of the pythonista pipeline. Merged from
      # mattpocock/code-review (two-axis skeleton, parallel dispatch, Fowler
      # smell baseline), codementor/code-review-excellence (severity
      # taxonomy, harvested — source skill left in place), and
      # existential-birds/beagle's python-code-review +
      # review-verification-protocol (Gates workflow, anti-confabulation
      # gate 0, valid-patterns/context-sensitive tables) — none vendored,
      # harvest-don't-vendor per the pythonista v2 plan. Hand-maintained —
      # see skills/python-review/ for the source of truth.
      - name: python-review
        source: local

      # Safe-tier mutation stage. Authored fresh: ruff format, ruff check
      # --fix, mypy, secret scan, dependency audit in a detect->fix->rerun
      # loop, every tool bootstrapped through uvx. No bespoke analyzers —
      # see skills/python-quality-tools/ for the source of truth.
      - name: python-quality-tools
        source: local

      # Safe-tier mutation stage. Merged from the retired python-simplifier
      # skill's prose (Simplification Principles, before/after catalog,
      # Over-Engineering anti-patterns) plus a verified cherry-pick from
      # affaan-m/everything-claude-code's python-patterns (EAFP/LBYL,
      # type-hint depth, dataclasses/NamedTuple, decorators, slots/generator
      # idioms, exception hierarchy, exception chaining) — harvested, not
      # vendored. See skills/python-patterns/ for the source of truth.
      - name: python-patterns
        source: local

      # Safe-tier mutation stage. Authored fresh, additive only: module
      # summaries, docstrings, type annotations, comments — targets the
      # gaps python-scan's check_documentation.py flags. See
      # skills/python-document/ for the source of truth.
      - name: python-document
        source: local

      # Deep-work, explicit-call-only structural critique: interface depth,
      # the deletion test, seam placement. Harvests only mattpocock/
      # codebase-design's deletion test and module/interface/seam vocabulary
      # (glossary + three principles) — its CONTEXT.md/ADR requirement, the
      # essentials/grilling loop, and the self-contained HTML report are all
      # dropped in favor of structured findings. See
      # skills/python-architecture/ for the source of truth.
      - name: python-architecture
        source: local

      # Originally fetched from community (https://github.com/wshobson/agents,
      # plugins/python-development/skills/python-testing-patterns); now
      # synthesized with TDD methodology from the mattpocock and superpowers
      # tdd skills and hand-maintained — see
      # skills/python-testing-patterns/ for the source of truth.
      - name: python-testing-patterns
        source: local

      # Orchestrator. tidy is now reachable end-to-end (scan -> patterns ->
      # quality-tools -> verify); ship-it's safe tier (document -> patterns
      # -> quality-tools) is reachable too — see skills/python-workflow/ for
      # the source of truth and what's still missing (deep-work electives).
      - name: python-workflow
        source: local

      - name: uv-package-manager
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/python-development/skills/uv-package-manager"

  # ---------------------------------------------------------------------------
  # thinktank — thinking, planning, and ideation skills
  # A mix of custom skills and community-sourced skills for structured thinking,
  # planning, and decision-making.
  # ---------------------------------------------------------------------------
  - name: thinktank
    description: Thinking, planning, and ideation skills — custom and community-sourced
    version: "0.1.0"
    skills:
      # Custom skills (source of truth is skills/ in this repo)
      - name: clarity
        source: local

      - name: devils-advocate
        source: local

      - name: plan-and-critique
        source: local

      - name: adversarial-review
        source: local

      # Community skills (git-cloned on make fetch / make fetch-build)
      - name: llm-council
        source: community
        repo: "https://github.com/aiwithremy/claude-skills-llm-council"
        path: "."

      - name: prd
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/prd"

      - name: claude-handoff
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/in-progress/claude-handoff"

      - name: claude-loop-engineering
        source: community
        repo: "https://github.com/iamarvindh/claude-loop-engineering"
        path: "skill"

      - name: doc-coauthoring
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/doc-coauthoring"

  # ---------------------------------------------------------------------------
  # mattpocock — Matt Pocock's engineering / spec-driven-development skills
  # ---------------------------------------------------------------------------
  - name: mattpocock
    description: Matt Pocock's engineering skills — spec-driven development, TDD, code review, architecture
    version: "0.1.0"
    skills:
      # Wildcard group entry: fetches every skill directory found directly
      # under skills/engineering/ in one clone (see bundles.yaml header).
      - name: mattpocock-engineering
        source: community
        repo: "https://github.com/mattpocock/skills"
        path: "skills/engineering/*"

  # ---------------------------------------------------------------------------
  # officetools — Anthropic's document-format skills for creating and editing
  # Office/PDF documents (docx, pdf, pptx, xlsx).
  # ---------------------------------------------------------------------------
  - name: officetools
    description: Create and edit Office documents — docx, pdf, pptx, and xlsx
    version: "0.1.0"
    skills:
      - name: docx
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/docx"

      - name: pdf
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/pdf"

      - name: pptx
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/pptx"

      - name: xlsx
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/xlsx"

  # ---------------------------------------------------------------------------
  # frontend — frontend design and UI craft skills: layout/UX design
  # (Anthropic), production frontend iteration (impeccable), and anti-slop
  # design taste for landing pages/portfolios (taste-skill).
  # ---------------------------------------------------------------------------
  - name: frontend
    description: Frontend design and UI craft skills — design, iterate, and critique frontend interfaces
    version: "0.1.0"
    skills:
      - name: frontend-design
        source: community
        repo: "https://github.com/anthropics/skills"
        path: "skills/frontend-design"

      - name: impeccable
        source: community
        repo: "https://github.com/pbakaus/impeccable"
        path: ".claude/skills/impeccable"

      - name: design-taste-frontend
        source: community
        repo: "https://github.com/leonxlnx/taste-skill"
        path: "skills/taste-skill"

  # ---------------------------------------------------------------------------
  # database — SQL and data engineering skills: query review and
  # optimization (awesome-copilot), Azure Kusto queries (azure-skills),
  # and profiling tables (astronomer).
  # ---------------------------------------------------------------------------
  - name: database
    description: SQL and data engineering skills — query review, optimization, Azure Kusto, and table profiling
    version: "0.1.0"
    catalog: true
    mcp:
      # Postgres-only, query-plan analysis + index tuning. Docker-only —
      # `uvx postgres-mcp` has an upstream bug.
      #
      # --access-mode=restricted is load-bearing: a second SQL validator
      # rejects writes before Postgres sees them, independent of the DB
      # role's own grant.
      #
      # The container's own env var name (DATABASE_URI) is fixed upstream,
      # so the rename happens inline in args instead.
      - name: pgquery
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "DATABASE_URI=${PGQUERY_URI}",
            "crystaldba/postgres-mcp",
            "--access-mode=restricted",
            "--transport=stdio",
          ]
        env:
          PGQUERY_URI:

      # Multi-engine (Postgres/MySQL/MSSQL/BigQuery/...), configured via a
      # tools.yaml mounted into the container — inherently user-specific, so
      # this repo can't ship one. Point DBTOOLS_CONFIG_PATH at your own
      # (absolute path — docker bind mounts reject relative ones).
      # Format: https://googleapis.github.io/genai-toolbox/
      - name: dbtools
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-v",
            "${DBTOOLS_CONFIG_PATH}:/tools.yaml:ro",
            "us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest",
            "--stdio",
            "--config",
            "/tools.yaml",
          ]
        env:
          DBTOOLS_CONFIG_PATH:

      # Dedicated MySQL (benborla/mcp-server-mysql, MIT) — an app-level
      # write gate independent of the DB grant, same pattern as pgquery's
      # --access-mode. No published image; Dockerfile vendored at
      # docker/mysql-mcp/ (pinned commit — see that file). Build once:
      #   docker build -t indie-marketplace-mysql-mcp:local plugins/database/docker/mysql-mcp
      #
      # ALLOW_*_OPERATION flags are hardcoded false here, overriding the
      # image's own true defaults — non-configurable by design.
      - name: mysql-mcp
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "MYSQL_HOST=${MYSQL_MCP_HOST}",
            "-e",
            "MYSQL_USER=${MYSQL_MCP_USER}",
            "-e",
            "MYSQL_PASS=${MYSQL_MCP_PASS}",
            "-e",
            "MYSQL_DB=${MYSQL_MCP_DB}",
            "-e",
            "ALLOW_INSERT_OPERATION=false",
            "-e",
            "ALLOW_UPDATE_OPERATION=false",
            "-e",
            "ALLOW_DELETE_OPERATION=false",
            "indie-marketplace-mysql-mcp:local",
          ]
        env:
          MYSQL_MCP_HOST:
          MYSQL_MCP_USER:
          MYSQL_MCP_PASS:
          MYSQL_MCP_DB:

      # Dedicated MSSQL (JexinSam/mssql_mcp_server, MIT) — query_sql regex-
      # gates to SELECT/WITH/SHOW; execute_sql stays unrestricted upstream,
      # so treat this as read-mostly, not read-only. No published image;
      # Dockerfile vendored at docker/mssql-mcp/ (pinned commit, also fixes
      # an upstream build bug). Build once:
      #   docker build -t indie-marketplace-mssql-mcp:local plugins/database/docker/mssql-mcp
      - name: mssql-mcp
        command: docker
        args:
          [
            "run",
            "-i",
            "--rm",
            "-e",
            "MSSQL_HOST=${MSSQL_MCP_HOST}",
            "-e",
            "MSSQL_DATABASE=${MSSQL_MCP_DATABASE}",
            "-e",
            "MSSQL_USER=${MSSQL_MCP_USER}",
            "-e",
            "MSSQL_PASSWORD=${MSSQL_MCP_PASSWORD}",
            "indie-marketplace-mssql-mcp:local",
          ]
        env:
          MSSQL_MCP_HOST:
          MSSQL_MCP_DATABASE:
          MSSQL_MCP_USER:
          MSSQL_MCP_PASSWORD:
    skills:
      - name: sql-code-review
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/sql-code-review"

      - name: sql-optimization
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/sql-optimization"

      - name: azure-kusto
        source: community
        repo: "https://github.com/microsoft/azure-skills"
        path: "skills/azure-kusto"

      - name: profiling-tables
        source: community
        repo: "https://github.com/astronomer/agents"
        path: "skills/profiling-tables"

  # ---------------------------------------------------------------------------
  # azdevops — containers, Kubernetes, CI/CD, and Azure DevOps skills.
  # ---------------------------------------------------------------------------
  - name: azdevops
    description: DevOps and infrastructure skills — containers, Kubernetes, CI/CD, and Azure DevOps
    version: "0.1.0"
    catalog: true
    mcp:
      # Official Azure MCP server (microsoft/mcp), 40+ services. Auth via
      # an existing `az login` session — no env var.
      - name: azcloud
        command: npx
        args: ["-y", "@azure/mcp@latest", "server", "start"]

      # Official Azure DevOps MCP server (microsoft/azure-devops-mcp). Org
      # name is a required positional arg, injected via ${...}.
      # --authentication azcli reuses the same `az login` session as
      # azcloud (upstream default is an interactive browser sign-in).
      - name: azdevops
        command: npx
        args:
          [
            "-y",
            "@azure-devops/mcp",
            "${AZDEVOPS_ORG}",
            "--authentication",
            "azcli",
          ]
        env:
          AZDEVOPS_ORG:

      # Official AKS MCP server (Azure/aks-mcp) — a Go binary with no npm
      # package; download a release from
      # https://github.com/Azure/aks-mcp/releases/latest and point
      # AZAKS_BIN at it. Auth: `az login` + kubeconfig, readonly by default.
      - name: azaks
        command: "${AZAKS_BIN}"
        args: ["--transport", "stdio"]
        env:
          AZAKS_BIN:

      # Azure Data Explorer / Kusto (johnib/kusto-mcp, npm) — picked over
      # pab1it0/adx-mcp-server, which hands raw queries straight to the
      # Kusto SDK with no read-only layer.
      #
      # KUSTO_ALLOW_WRITE_OPERATIONS=false is load-bearing: upstream
      # defaults it true; setting it false enables a real validator
      # rejecting every dot-command except the introspective .show family.
      #
      # Auth: fill in the three service-principal vars for an unattended
      # identity, or leave them blank to fall through to managed identity
      # then the same `az login` session azcloud/azdevops use.
      #
      # Caveat: reports anonymous usage telemetry to the maintainer (tool
      # names, latency, salted tenant/user hashes — never query text or
      # results); redirectable to your own OTLP collector, not disable-able.
      - name: azkusto
        command: env
        args:
          [
            "KUSTO_AUTH_METHOD=azure-identity",
            "KUSTO_ALLOW_WRITE_OPERATIONS=false",
            "KUSTO_CLUSTER_URL=${AZKUSTO_CLUSTER_URL}",
            "KUSTO_DEFAULT_DATABASE=${AZKUSTO_DATABASE}",
            "AZURE_TENANT_ID=${AZKUSTO_TENANT_ID}",
            "AZURE_CLIENT_ID=${AZKUSTO_CLIENT_ID}",
            "AZURE_CLIENT_SECRET=${AZKUSTO_CLIENT_SECRET}",
            "npx",
            "-y",
            "kusto-mcp",
          ]
        env:
          AZKUSTO_CLUSTER_URL:
          AZKUSTO_DATABASE:
          AZKUSTO_TENANT_ID:
          AZKUSTO_CLIENT_ID:
          AZKUSTO_CLIENT_SECRET:
    skills:
      - name: multi-stage-dockerfile
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/multi-stage-dockerfile"

      - name: devcontainer-setup
        source: community
        repo: "https://github.com/trailofbits/skills"
        path: "plugins/devcontainer-setup/skills/devcontainer-setup"

      - name: helm-chart-scaffolding
        source: community
        repo: "https://github.com/wshobson/agents"
        path: "plugins/kubernetes-operations/skills/helm-chart-scaffolding"

      - name: kubernetes-specialist
        source: community
        repo: "https://github.com/jeffallan/claude-skills"
        path: "skills/kubernetes-specialist"

      - name: ci-cd-and-automation
        source: community
        repo: "https://github.com/addyosmani/agent-skills"
        path: "skills/ci-cd-and-automation"

      # Needs `az extension add --name azure-devops` (one-time, not tracked
      # here) on top of the az CLI itself — see deps: below.
      - name: azure-devops-cli
        source: community
        repo: "https://github.com/github/awesome-copilot"
        path: "skills/azure-devops-cli"
    deps:
      # Shared by azcloud/azdevops/azaks/azkusto above (their MCP servers
      # reuse an existing `az login` session) and azure-devops-cli's own
      # skill.
      - command: az
        install: brew install azure-cli
        manual: "https://learn.microsoft.com/cli/azure/install-azure-cli"

  # ---------------------------------------------------------------------------
  # research — reference-library and notebook MCP servers: Zotero library
  # search and Google's NotebookLM.
  # ---------------------------------------------------------------------------
  - name: research
    description: Research and reference MCP servers — Zotero library search and Google NotebookLM
    version: "0.1.0"
    catalog: true
    mcp:
      # zotero-mcp (PyPI zotero-mcp, MIT). Defaults to local mode
      # (ZOTERO_LOCAL=true hardcoded — a mode flag, not a secret) talking to
      # a Zotero 7+ desktop app locally, needing zero credentials. The Web
      # API vars below are only for remote/no-desktop-app setups; blank is
      # safe since local mode wins regardless.
      - name: zotero
        command: env
        args:
          [
            "ZOTERO_LOCAL=true",
            "ZOTERO_API_KEY=${ZOTERO_API_KEY}",
            "ZOTERO_LIBRARY_ID=${ZOTERO_LIBRARY_ID}",
            "ZOTERO_LIBRARY_TYPE=${ZOTERO_LIBRARY_TYPE}",
            "zotero-mcp",
          ]
        env:
          ZOTERO_API_KEY:
          ZOTERO_LIBRARY_ID:
          ZOTERO_LIBRARY_TYPE:

      # Unified CLI + MCP server for Google's Gemini Notebook (NotebookLM).
      # `uv tool install notebooklm-mcp-cli` installs both an `nlm` CLI and
      # this server binary. Uses undocumented internal APIs — can break on a
      # Google-side change with no warning.
      #
      # No env var: run `nlm login` once (browser session, cookies persisted
      # by the CLI itself); re-run if cookies expire (~2-4 weeks).
      - name: notebooklm
        command: notebooklm-mcp

  # ---------------------------------------------------------------------------
  # web-search — semantic web search and page fetch, scraping, recent
  # public discussion, and YouTube search/lookup.
  # ---------------------------------------------------------------------------
  - name: web-search
    description: Web search, scraping, and discovery skills — Exa semantic search, Firecrawl, recent social discussion, and YouTube lookup
    version: "0.1.0"
    catalog: true
    mcp:
      # Semantic web search and page fetch via Exa's stdio MCP package.
      - name: exa
        command: npx
        args: ["-y", "exa-mcp-server"]
        env:
          EXA_API_KEY:
    skills:
      # Firecrawl's own umbrella skill — SKILL.md plus rules/. Deliberately
      # CLI + skill instead of Firecrawl's own MCP server: the skill teaches
      # the flags and the CLI returns markdown sized for a context window,
      # where an MCP server would sit in every session's tool list.
      #
      # Auth is `firecrawl login --browser` (or --api-key), a one-time
      # interactive step like `gh auth login` — no env var to wire here.
      - name: firecrawl
        source: community
        repo: "https://github.com/firecrawl/cli"
        path: "skills/firecrawl"

      # Its own script reads the bare SCRAPECREATORS_API_KEY straight from
      # the process environment (not through Claude Code's ${VAR}
      # substitution, which only applies to mcp: entries) — the name below
      # must match exactly, no prefix. SKILL.md documents 13 more optional
      # provider keys beyond this primary one; add one here only if needed.
      - name: last30days
        source: community
        repo: "https://github.com/mvanhorn/last30days-skill"
        path: "skills/last30days"
        env:
          SCRAPECREATORS_API_KEY:

      # Generic YouTube search/channel-fetch primitive via the yt-dlp CLI —
      # see deps: below for the CLI itself.
      - name: search-yt-dlp
        source: local
    deps:
      - command: yt-dlp
        install: brew install yt-dlp
        manual: "https://github.com/yt-dlp/yt-dlp#installation"

      - command: firecrawl
        install: npm install -g firecrawl-cli@latest
        manual: "https://docs.firecrawl.dev/sdks/cli"

  # ---------------------------------------------------------------------------
  # browser — general browser automation via the Playwright CLI's own
  # plan/generate/heal workflow. CLI-driven, not an always-on MCP server —
  # live exploratory browser/DOM control stays opt-in by nature.
  # ---------------------------------------------------------------------------
  - name: browser
    description: Browser automation skill — general actions via the Playwright CLI
    version: "0.1.0"
    catalog: true
    skills:
      # Upstream's own CLI + skill: general browser actions plus its own
      # CLI-driven plan/generate/heal workflow — see deps: below for the
